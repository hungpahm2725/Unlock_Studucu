<!DOCTYPE html>
<!--
  Studocu Tool - Giao diện Popup
  Tác giả: HPahm
-->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studocu Tool</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="top">
    <div class="logo">S</div>
    <div>
      <div class="name">Studocu Tool</div>
      <div class="by">Made by HPahm · sleep 3am</div>
    </div>
  </div>

  <button id="checkBtn" class="btn">
    <div>
      <div class="btn-title">Tạo file PDF</div>
      <div class="btn-desc">Tải toàn bộ tài liệu</div>
    </div>
  </button>

  <button id="clearBtn" class="btn outline">
    <div>
      <div class="btn-title">Bypass khóa & mờ</div>
      <div class="btn-desc">Xóa cookie + reset trang</div>
    </div>
  </button>

  <div id="status" class="status">
    <span id="status-text">Sẵn sàng</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
